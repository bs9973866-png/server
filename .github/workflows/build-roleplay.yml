name: Build NEW YORK RP plugin and bundle city map

on:
  push:
    paths:
      - "roleplay/**"
      - ".github/workflows/build-roleplay.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build plugin
        run: mvn -B -f roleplay/pom.xml clean package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: NewYorkRP-Paper-26.2
          path: roleplay/target/NewYorkRP.jar
          if-no-files-found: error

  bundle-city-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download map archive from its public download page
        if: ${{ hashFiles('maps/new-york-midtown-manhattan.zip') == '' }}
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4
          mkdir -p maps
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from pathlib import Path

          page = "https://www.mediafire.com/file/ijs4stj0ye1as1k/New-York-Midtown-Manhattan-by-BasVerhagen-2.9-MC1.19.4-ZIP.zip/file"
          session = requests.Session()
          session.headers.update({"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36"})
          response = session.get(page, timeout=60)
          response.raise_for_status()
          soup = BeautifulSoup(response.text, "html.parser")
          button = soup.find(id="downloadButton")
          if not button or not button.get("href"):
              raise SystemExit("MediaFire did not provide its public download link.")
          url = button["href"]
          download = session.get(url, stream=True, timeout=180)
          download.raise_for_status()
          content_type = download.headers.get("Content-Type", "").lower()
          first = next(download.iter_content(1024 * 1024), b"")
          if "text/html" in content_type or not first.startswith(b"PK"):
              raise SystemExit(f"Download was not a ZIP archive (Content-Type: {content_type}).")
          target = Path("maps/new-york-midtown-manhattan.zip")
          with target.open("wb") as f:
              f.write(first)
              for chunk in download.iter_content(1024 * 1024):
                  if chunk:
                      f.write(chunk)
          print(f"Downloaded {target} ({target.stat().st_size} bytes)")
          PY
      - name: Verify Minecraft world archive
        if: ${{ hashFiles('maps/new-york-midtown-manhattan.zip') != '' }}
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          p = Path("maps/new-york-midtown-manhattan.zip")
          if not p.exists() or p.stat().st_size < 1_000_000:
              raise SystemExit("Map archive is missing or unexpectedly small")
          with zipfile.ZipFile(p) as z:
              worlds = [n for n in z.namelist() if n.lower().endswith("/level.dat") or n.lower() == "level.dat"]
              if len(worlds) != 1:
                  raise SystemExit(f"Expected exactly one level.dat, found {len(worlds)}")
          print(f"Verified {p} ({p.stat().st_size} bytes)")
          PY
      - name: Commit map archive to repository
        if: ${{ hashFiles('maps/new-york-midtown-manhattan.zip') != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maps/new-york-midtown-manhattan.zip
          if ! git diff --cached --quiet; then
            git commit -m "Add Midtown Manhattan city world archive"
            git push
          fi
