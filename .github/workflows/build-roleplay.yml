name: Build NEW YORK RP plugin and bundle city map

on:
  push:
    paths:
      - "roleplay/**"
      - ".github/workflows/build-roleplay.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build plugin
        run: mvn -B -f roleplay/pom.xml clean package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: NewYorkRP-Paper-26.2
          path: roleplay/target/NewYorkRP.jar
          if-no-files-found: error

  bundle-city-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download map archive
        if: ${{ hashFiles('maps/new-york-midtown-manhattan.zip') == '' }}
        run: |
          python -m pip install --disable-pip-version-check yt-dlp
          mkdir -p maps
          python -m yt_dlp --no-warnings --no-progress --force-overwrites \
            -o maps/new-york-midtown-manhattan.zip \
            "https://www.mediafire.com/file/ijs4stj0ye1as1k/New-York-Midtown-Manhattan-by-BasVerhagen-2.9-MC1.19.4-ZIP.zip/file"
      - name: Verify Minecraft world archive
        if: ${{ hashFiles('maps/new-york-midtown-manhattan.zip') != '' }}
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          p = Path("maps/new-york-midtown-manhattan.zip")
          if not p.exists() or p.stat().st_size < 1_000_000:
              raise SystemExit("Map archive is missing or unexpectedly small")
          with zipfile.ZipFile(p) as z:
              worlds = [n for n in z.namelist() if n.lower().endswith("/level.dat") or n.lower() == "level.dat"]
              if len(worlds) != 1:
                  raise SystemExit(f"Expected exactly one level.dat, found {len(worlds)}")
          print(f"Verified {p} ({p.stat().st_size} bytes)")
          PY
      - name: Commit map archive to repository
        if: ${{ hashFiles('maps/new-york-midtown-manhattan.zip') != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maps/new-york-midtown-manhattan.zip
          if ! git diff --cached --quiet; then
            git commit -m "Add Midtown Manhattan city world archive"
            git push
          fi
